name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build binary wheel and source tarball
        run: python -m build

      - name: Check package metadata with twine
        run: python -m twine check dist/*

      # Method 1: If PYPI_API_TOKEN repository secret is present, use twine directly
      - name: Publish to PyPI via Token (if secret is configured)
        if: env.PYPI_TOKEN != ''
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/* -u __token__ -p "${{ secrets.PYPI_API_TOKEN }}" --skip-existing

      # Method 2: Trusted Publishing (OIDC) if no secret is set
      - name: Publish to PyPI via OIDC Trusted Publishing
        if: env.PYPI_TOKEN == ''
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
